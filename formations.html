<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G∆MYs Academy — Mes formations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --rouge: #C81E2B;
    --rouge-sombre: #7A0F1A;
    --noir: #111111;
    --fond: #F7F5F0;
    --carte: #FFFFFF;
    --texte: #171717;
    --texte-clair: #6b6862;
  }
  html{ font-size: 14px; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--fond);
    color: var(--texte);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding: 16px 6%;
    background: var(--noir);
    position: sticky; top:0; z-index: 10;
    flex-wrap: wrap;
    gap: 10px;
  }
  .logo{ font-family:'Archivo Black', sans-serif; font-size: 1.05rem; color:#fff; }
  .logo span{ color: var(--rouge); }
  .header-droite{ display:flex; align-items:center; gap: 18px; flex-wrap: wrap; }
  nav ul{ display:flex; gap: 18px; list-style:none; flex-wrap: wrap; }
  nav a{
    font-size: 0.76rem; font-weight:600; text-transform: uppercase;
    letter-spacing: 0.04em; color: rgba(255,255,255,0.8);
    transition: color .2s;
  }
  nav a:hover{ color: var(--rouge); }
  .btn-connexion{
    font-size: 0.76rem; font-weight:700; color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 7px 16px; border-radius: 999px;
    transition: background .2s, border-color .2s;
    white-space: nowrap;
  }
  .btn-connexion:hover{ background: var(--rouge); border-color: var(--rouge); }

  .hero{
    padding: 50px 6% 30px;
    text-align:center;
    max-width: 780px;
    margin: 0 auto;
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    color: var(--rouge); font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    display:block; margin-bottom: 14px;
  }
  .hero h1{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(1.4rem, 5.5vw, 1.9rem);
    line-height: 1.2;
  }
  .hero h1 em{ font-style: normal; color: var(--rouge); }

  .section-title{
    display:flex; align-items:baseline; gap: 14px;
    padding: 20px 6% 24px;
    max-width: 1180px; margin: 0 auto;
  }
  .section-title h2{ font-family:'Archivo Black', sans-serif; font-size: 1.2rem; }
  .section-title .count{ font-family:'IBM Plex Mono', monospace; color: var(--rouge); font-size: 0.76rem; }
  .section-title .line{ flex:1; height:1px; background: rgba(17,17,17,0.12); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 34px;
    padding: 0 6% 100px;
    max-width: 1180px; margin: 0 auto;
  }

  .carte{
    background: var(--carte);
    border-radius: 20px;
    overflow:hidden;
    border: 1px solid rgba(17,17,17,0.08);
    box-shadow: 0 2px 14px rgba(17,17,17,0.04);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .carte:hover{
    transform: translateY(-6px);
    box-shadow: 0 14px 30px rgba(17,17,17,0.1);
  }

  /* Affiche de la formation, avec badge niveau incrusté */
  .affiche-wrap{
    position:relative;
    aspect-ratio: 16/10;
    background: var(--noir);
    overflow:hidden;
  }
  .affiche-wrap img{
    width:100%; height:100%; object-fit:cover;
    display:block;
  }
  .badge-niveau{
    position:absolute; top:12px; left:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--rouge); color:#fff;
    padding: 4px 9px; border-radius: 20px;
  }

  .carte-corps{ padding: 18px 16px 20px; }
  .carte-corps h3{
    font-family:'Archivo Black', sans-serif;
    font-size: 0.98rem; margin-bottom: 8px;
  }
  .carte-corps p{
    color: var(--texte-clair);
    font-size: 0.82rem;
    margin-bottom: 16px;
  }

  .carte-footer{ display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px; }
  .prix{ font-family:'IBM Plex Mono', monospace; font-size: 0.9rem; color: var(--texte); }
  .prix span{ display:block; font-size: 0.62rem; color: var(--texte-clair); text-transform: uppercase; }

  .btn{
    background: var(--rouge); color:#fff; font-weight:600; font-size: 0.76rem;
    padding: 9px 16px; border-radius: 999px; transition: background .2s;
    display:inline-block;
    white-space: nowrap;
  }
  .btn:hover{ background: var(--rouge-sombre); }

  footer{
    text-align:center; padding: 26px 6%;
    color: var(--texte-clair); font-size: 0.8rem;
    background: var(--noir);
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>

<header>
  <div class="logo">G<span>∆</span>MYs <span>ACADEMY</span></div>
  <div class="header-droite">
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="formations.html">Formations</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <a href="inscription.html" class="btn-connexion">Se connecter</a>
  </div>
</header>

<section class="hero">
  <span class="eyebrow">Formation graphique — 100% mobile</span>
  <h1>Toutes mes formations, <em>choisis la tienne</em>.</h1>
</section>

<div class="section-title">
  <h2>Mes formations</h2>
  <div class="line"></div>
  <span class="count" id="compteur">0 disponibles</span>
</div>

<div class="grid" id="grille-formations">
  <!-- Les cartes sont générées automatiquement depuis formations-data.js -->
</div>

<footer>
  © 2026 G∆MYs Academy — Cotonou, Bénin
</footer>

<script src="formations-data.js"></script>
<script>
  const grille = document.getElementById('grille-formations');
  const compteur = document.getElementById('compteur');

  compteur.textContent = FORMATIONS.length + (FORMATIONS.length > 1 ? " disponibles" : " disponible");

  FORMATIONS.forEach(function(f){
    const carte = document.createElement('div');
    carte.className = 'carte';
    carte.innerHTML = `
      <div class="affiche-wrap">
        <img src="${f.affiche}" alt="Affiche — ${f.titre}" onerror="this.src='https://placehold.co/600x375/111111/F7F5F0?text=Affiche+%C3%A0+ajouter'">
        <span class="badge-niveau">${f.niveau}</span>
      </div>
      <div class="carte-corps">
        <h3>${f.titre}</h3>
        <p>${f.description}</p>
        <div class="carte-footer">
          <div class="prix">${f.prix.toLocaleString('fr-FR')} FCFA<span>Paiement unique</span></div>
          <a href="inscription.html?formation=${f.id}" class="btn">Voir la formation</a>
        </div>
      </div>
    `;
    grille.appendChild(carte);
  });
</script>

</body>
</html>
