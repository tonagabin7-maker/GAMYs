<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G∆MYs Academy — Mes formations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script>
  // Vérifie la session AVANT l'affichage de la page, pour éviter le flash du bouton "Connexion"
  (function(){
    try{
      const brut = localStorage.getItem('gamys_session');
      if(!brut) return;
      const session = JSON.parse(brut);
      if(session && session.expires_at > Date.now()){
        document.documentElement.classList.add('connecte');
      }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --rouge: #C81E2B;
    --rouge-sombre: #7A0F1A;
    --noir: #111111;
    --nuit: #16130f;
    --fond: #F7F5F0;
    --carte: #FFFFFF;
    --texte: #171717;
    --texte-clair: #6b6862;
  }
  html{ font-size: 14px; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--fond);
    color: var(--texte);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family: inherit; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 6%;
    background: #fff;
    position: sticky; top:0; z-index: 30;
    border-bottom: 1px solid rgba(17,17,17,0.08);
  }
  .logo{ font-family:'Archivo Black', sans-serif; font-size: 1.05rem; color: var(--texte); }
  .logo span{ color: var(--rouge); }
  .header-droite{ display:flex; align-items:center; gap: 12px; }
  .btn-connexion{
    font-size: 0.78rem; font-weight:700; color: #fff;
    background: var(--rouge);
    padding: 9px 20px; border-radius: 999px;
    transition: background .2s;
    white-space: nowrap;
  }
  .btn-connexion:hover{ background: var(--rouge-sombre); }
  html.connecte #btn-connexion-header,
  html.connecte #lien-connexion-menu{ display:none !important; }
  .btn-menu{
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(17,17,17,0.15);
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .btn-menu span, .btn-menu span::before, .btn-menu span::after{
    content:""; display:block;
    width: 16px; height: 2px;
    background: var(--texte);
    position:relative;
  }
  .btn-menu span::before{ position:absolute; top:-5px; }
  .btn-menu span::after{ position:absolute; top:5px; }

  .menu-overlay{
    position: fixed; inset:0;
    background: #fff;
    z-index: 40;
    display:none;
    flex-direction:column;
    padding: 14px 6% 30px;
    overflow-y:auto;
  }
  .menu-overlay.ouvert{ display:flex; }
  .menu-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 26px; }
  .btn-fermer{
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid rgba(17,17,17,0.15); background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size: 1.1rem; cursor:pointer;
  }
  .menu-recherche{
    display:flex; align-items:center; gap:10px;
    border: 1px solid rgba(17,17,17,0.15); border-radius: 999px;
    padding: 12px 18px; margin-bottom: 26px;
    color: var(--texte-clair); font-size: 0.85rem;
  }
  .menu-liens{ list-style:none; display:flex; flex-direction:column; gap: 22px; }
  .menu-liens a{ font-size: 1.05rem; font-weight:700; color: var(--texte); }
  .menu-liens a:hover{ color: var(--rouge); }
  .menu-cta{
    margin-top: 30px; display:block; text-align:center;
    background: var(--rouge); color:#fff; font-weight:700; font-size: 0.9rem;
    padding: 14px; border-radius: 999px;
  }

  .hero{
    background: var(--nuit);
    padding: 40px 6% 34px;
    text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    color: var(--rouge); font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    display:block; margin-bottom: 12px;
  }
  .hero h1{
    font-family:'Archivo Black', sans-serif;
    color:#fff;
    font-size: clamp(1.4rem, 6vw, 1.9rem);
    line-height: 1.2;
    max-width: 560px;
    margin: 0 auto;
  }
  .hero h1 em{ font-style:normal; color: var(--rouge); }

  /* Onglets catégories, façon Blemama */
  .onglets{
    display:flex; gap: 10px; flex-wrap:wrap;
    max-width: 1100px; margin: 0 auto;
    padding: 24px 6% 0;
  }
  .onglet{
    font-size: 0.8rem; font-weight:700;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(17,17,17,0.15);
    background: #fff;
    cursor:pointer;
  }
  .onglet.actif{ background: var(--noir); color:#fff; border-color: var(--noir); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
    padding: 24px 6% 90px;
    max-width: 1100px; margin: 0 auto;
  }

  .carte{
    background: var(--carte);
    border-radius: 18px;
    overflow:hidden;
    border: 1px solid rgba(17,17,17,0.08);
    box-shadow: 0 2px 14px rgba(17,17,17,0.04);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .carte:hover{ transform: translateY(-5px); box-shadow: 0 14px 30px rgba(17,17,17,0.1); }

  .img-wrap{ position:relative; aspect-ratio: 16/10; background: var(--noir); overflow:hidden; }
  .img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badge-niveau{
    position:absolute; top:12px; left:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--rouge); color:#fff;
    padding: 4px 9px; border-radius: 20px;
  }

  .btn-options{
    position:absolute; top:10px; right:10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(17,17,17,0.55); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size: 1.15rem; line-height:1; cursor:pointer; z-index:2;
  }
  .menu-options{
    position:absolute; top:46px; right:10px;
    background:#fff; border-radius: 12px;
    border: 1px solid rgba(17,17,17,0.1);
    box-shadow: 0 10px 24px rgba(17,17,17,0.18);
    display:none; flex-direction:column; min-width: 190px;
    overflow:hidden; z-index:3;
  }
  .menu-options.ouvert{ display:flex; }
  .menu-options button{
    padding: 12px 14px; text-align:left; background:#fff; border:none;
    font-size: 0.82rem; font-weight:600; color: var(--texte); cursor:pointer;
  }
  .menu-options button:hover{ background: var(--fond); }
  .menu-options button.dans-panier{ color: var(--rouge); }

  .corps{ padding: 18px 16px 20px; }
  .corps h3{ font-family:'Archivo Black', sans-serif; font-size: 0.98rem; margin-bottom: 8px; }
  .corps p{ color: var(--texte-clair); font-size: 0.82rem; margin-bottom: 14px; }

  .stats{
    display:flex; gap: 12px; flex-wrap:wrap;
    font-size: 0.72rem; color: var(--texte-clair);
    margin-bottom: 16px;
  }

  .pied{ display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px; }
  .prix{ font-family:'IBM Plex Mono', monospace; font-size: 0.9rem; color: var(--texte); font-weight:700; }
  .btn{
    background: var(--rouge); color:#fff; font-weight:700; font-size: 0.76rem;
    padding: 9px 16px; border-radius: 999px; transition: background .2s;
    display:inline-block; white-space: nowrap;
  }
  .btn:hover{ background: var(--rouge-sombre); }

  footer{
    text-align:center; padding: 22px 6%;
    background: var(--noir); color: rgba(255,255,255,0.5);
    font-size: 0.74rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo">G<span>∆</span>MYs <span>ACADEMY</span></div>
  <div class="header-droite">
    <a href="inscription.html" class="btn-connexion" id="btn-connexion-header">Connexion</a>
    <button class="btn-menu" id="btn-ouvrir-menu" aria-label="Menu"><span></span></button>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay">
  <div class="menu-top">
    <div class="logo">G<span>∆</span>MYs <span>ACADEMY</span></div>
    <button class="btn-fermer" id="btn-fermer-menu" aria-label="Fermer">✕</button>
  </div>
  <div class="menu-recherche">🔍 Que veux-tu apprendre ?</div>
  <ul class="menu-liens">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="formations.html">Formations</a></li>
    <li><a href="inscription.html">Mon espace</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li id="lien-connexion-menu"><a href="inscription.html">Connexion</a></li>
    <li><a href="inscription.html">Mon panier <span id="panier-compteur" style="color:var(--rouge); font-weight:800;">(0)</span></a></li>
  </ul>
  <a href="inscription.html" class="menu-cta">Créer mon accès →</a>
</div>

<section class="hero">
  <span class="eyebrow">Catalogue</span>
  <h1>Toutes mes formations, <em>choisis la tienne</em>.</h1>
</section>

<div class="onglets">
  <div class="onglet actif" data-filtre="tout">Toutes</div>
  <div class="onglet" data-filtre="Débutant">Débutant</div>
  <div class="onglet" data-filtre="Intermédiaire">Intermédiaire</div>
</div>

<div class="grid" id="grille-formations">
  <!-- Cartes générées automatiquement depuis formations-data.js -->
</div>

<footer>
  © 2026 G∆MYs Academy — Cotonou, Bénin
</footer>

<script src="formations-data.js"></script>
<script>
  const btnOuvrir = document.getElementById('btn-ouvrir-menu');
  const btnFermer = document.getElementById('btn-fermer-menu');
  const menu = document.getElementById('menu-overlay');
  btnOuvrir.addEventListener('click', () => menu.classList.add('ouvert'));
  btnFermer.addEventListener('click', () => menu.classList.remove('ouvert'));

  const grille = document.getElementById('grille-formations');
  const onglets = document.querySelectorAll('.onglet');

  // ===== Panier partagé (stocké localement, lu aussi par inscription.html) =====
  function chargerPanier(){
    try{
      const brut = localStorage.getItem('gamys_panier');
      return brut ? JSON.parse(brut) : [];
    }catch(e){ return []; }
  }
  function sauvegarderPanier(){
    localStorage.setItem('gamys_panier', JSON.stringify(panier));
  }
  let panier = chargerPanier();

  function majCompteurPanier(){
    const compteur = document.getElementById('panier-compteur');
    if(compteur) compteur.textContent = '(' + panier.length + ')';
  }

  function afficher(filtre){
    grille.innerHTML = '';
    FORMATIONS
      .filter(f => filtre === 'tout' || f.niveau === filtre)
      .forEach(function(f){
        const dansLePanier = panier.includes(f.id);
        const carte = document.createElement('div');
        carte.className = 'carte';
        carte.innerHTML = `
          <div class="img-wrap">
            <img src="${f.affiche}" alt="Affiche — ${f.titre}" onerror="this.src='https://placehold.co/600x375/111111/F7F5F0?text=Affiche+%C3%A0+ajouter'">
            <span class="badge-niveau">${f.niveau}</span>
            <button type="button" class="btn-options" data-id="${f.id}" aria-label="Options">⋮</button>
            <div class="menu-options" data-menu-id="${f.id}">
              <button type="button" class="option-ajouter ${dansLePanier ? 'dans-panier' : ''}" data-id="${f.id}">
                ${dansLePanier ? '✓ Retirer du panier' : 'Ajouter au panier'}
              </button>
            </div>
          </div>
          <div class="corps">
            <h3>${f.titre}</h3>
            <p>${f.description}</p>
            <div class="stats">
              <span>⏱ ${f.duree}</span>
              <span>▶ ${f.lecons}</span>
            </div>
            <div class="pied">
              <div class="prix">${f.prix.toLocaleString('fr-FR')} FCFA</div>
              <a href="inscription.html" class="btn">Voir la formation</a>
            </div>
          </div>
        `;
        grille.appendChild(carte);
      });
  }

  // Clique sur le bouton "⋮" : ouvre/ferme son menu ; clique sur "Ajouter/Retirer du panier" : met à jour le panier
  grille.addEventListener('click', function(e){
    const btnOptions = e.target.closest('.btn-options');
    if(btnOptions){
      e.stopPropagation();
      const id = btnOptions.dataset.id;
      document.querySelectorAll('.menu-options').forEach(function(m){
        m.classList.toggle('ouvert', m.dataset.menuId === id && !m.classList.contains('ouvert'));
      });
      return;
    }
    const btnAjouter = e.target.closest('.option-ajouter');
    if(btnAjouter){
      const id = btnAjouter.dataset.id;
      const index = panier.indexOf(id);
      if(index === -1){ panier.push(id); } else { panier.splice(index, 1); }
      sauvegarderPanier();
      majCompteurPanier();
      const ongletActif = document.querySelector('.onglet.actif');
      afficher(ongletActif ? ongletActif.dataset.filtre : 'tout');
    }
  });

  // Ferme les menus "⋮" ouverts si on clique ailleurs sur la page
  document.addEventListener('click', function(){
    document.querySelectorAll('.menu-options.ouvert').forEach(m => m.classList.remove('ouvert'));
  });

  onglets.forEach(function(o){
    o.addEventListener('click', function(){
      onglets.forEach(x => x.classList.remove('actif'));
      o.classList.add('actif');
      afficher(o.dataset.filtre);
    });
  });

  majCompteurPanier();
  afficher('tout');
</script>

</body>
</html>
